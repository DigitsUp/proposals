<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigitsUp × Salt Air Pilates</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f5f2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .gate {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #888;
    margin: 0 0 32px;
  }
  .input-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
    color: #111;
    background: #fafafa;
    letter-spacing: 0.15em;
  }
  input[type="password"]:focus {
    border-color: #111;
    background: #fff;
  }
  input[type="password"].error {
    border-color: #e53e3e;
    animation: shake 0.3s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  button {
    width: 100%;
    padding: 14px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #333; }
  .error-msg {
    font-size: 13px;
    color: #e53e3e;
    margin-top: 10px;
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="gate">
  <div class="logo">DigitsUp</div>
  <h1>Protected Proposal</h1>
  <p>Enter the password to view your proposal.</p>
  <form id="form" autocomplete="off">
    <div class="input-wrap">
      <input type="password" id="pw" placeholder="Password" autofocus autocomplete="new-password">
    </div>
    <button type="submit">View Proposal</button>
    <div class="error-msg" id="err"></div>
  </form>
</div>
<script>
  document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();
    var val = document.getElementById('pw').value;
    var inp = document.getElementById('pw');
    var err = document.getElementById('err');
    if (val === 'WTF') {
      window.location.href = 'proposal-content.html';
    } else {
      inp.classList.add('error');
      err.textContent = 'Incorrect password. Please try again.';
      setTimeout(function() { inp.classList.remove('error'); }, 400);
      inp.value = '';
      inp.focus();
    }
  });
</script>
</body>
</html>
